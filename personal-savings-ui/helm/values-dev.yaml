serviceAccount:
  name: personal-savings-ui-dev-service-account

image:
  tag: 1.0.0

ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
  hosts:
    - host: personal-savings-ui.local
      paths:
        - path: /
          pathType: Prefix

configMap:
  fileName: environment-dev.json